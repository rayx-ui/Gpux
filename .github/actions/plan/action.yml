name: Plan the run
description: >-
  Chooses which jobs, platforms and tests a workflow run executes, from the manual inputs, the
  pull request's labels and the files it changes. See docs/ci.md.
inputs:
  jobs:
    description: Manual run only. Comma-separated job names, or `all`.
    default: all
  platforms:
    description: Manual run only. Comma-separated of ubuntu, windows, macos, or `all`.
    default: all
  grep:
    description: Manual run only. The test selector a lane passes to its runner (`--grep`).
    default: ''
  full:
    description: Manual run only. Run lane C's scroll-layer suites frame for frame (`true`).
    default: 'false'
  lane_c_jobs:
    description: Manual run only. Concurrent test processes of lane C on every platform; empty uses each platform's default.
    default: ''
outputs:
  jobs:
    description: JSON array of the job names to run.
    value: ${{ steps.plan.outputs.jobs }}
  os:
    description: JSON array of the runner images to run on.
    value: ${{ steps.plan.outputs.os }}
  lane_c:
    description: >-
      JSON matrix `include` for lane C: the chosen platforms where lane C runs (WARP only when the
      rules allow), each with its `--jobs`.
    value: ${{ steps.plan.outputs.lane_c }}
  grep:
    description: The test selector, empty for the lane's own selection.
    value: ${{ steps.plan.outputs.grep }}
  full:
    description: '`true` when lane C runs its scroll-layer suites in full mode, `false` sampled.'
    value: ${{ steps.plan.outputs.full }}
  skipped:
    description: Lane C platforms the plan left out and why, empty when none.
    value: ${{ steps.plan.outputs.skipped }}
runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        DISPATCH_JOBS: ${{ inputs.jobs }}
        DISPATCH_PLATFORMS: ${{ inputs.platforms }}
        DISPATCH_GREP: ${{ inputs.grep }}
        DISPATCH_FULL: ${{ inputs.full }}
        DISPATCH_LANE_C_JOBS: ${{ inputs.lane_c_jobs }}
        # The labels are read when the plan runs, so a re-run sees the labels as they are now.
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        EVENT_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        if [ -n "${PR_NUMBER:-}" ]; then
          PR_LABELS=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '[.labels[].name]' 2>/dev/null || echo "$EVENT_LABELS")
          export PR_LABELS
        fi
        bash "${{ github.action_path }}/plan.sh"
