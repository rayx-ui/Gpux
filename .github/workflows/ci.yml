name: Gpux

on:
  pull_request:
  # The nightly run covers what a pull request leaves out: every platform, lane C in full mode.
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      jobs:
        description: >-
          Jobs to run: all, or a comma-separated list of check, test, lane-a, lane-c, lane-d,
          package
        default: all
      platforms:
        description: 'Platforms to run on: all, or a comma-separated list of ubuntu, windows, macos'
        default: all
      grep:
        description: Select the tests of lanes A, C and D by name (`gpux-testkit --grep`; no spaces)
        default: ''
      full:
        description: Run lane C's scroll-layer suites frame for frame instead of sampled
        type: boolean
        default: false
      lane-c-jobs:
        description: Concurrent test processes of lane C on every platform (empty uses each platform's default)
        default: ''
      update-goldens:
        description: Regenerate the lane C goldens of each backend and upload them as artifacts
        type: boolean
        default: false

# A new push to a pull request cancels its superseded run; scheduled and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'schedule' && '-nightly' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Full debug info makes the workspace's test and example binaries outgrow the Linux runner's
  # disk; line tables keep backtraces readable.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The vendored fork crates (gpux-wgpu, gpux-accesskit-macos) are upstream sources; gpux does
  # not lint or test them. gpux-accesskit-macos builds only on Apple platforms.
  FORK_EXCLUDES: >-
    --exclude gpux-wgpu --exclude gpux-wgpu-core --exclude gpux-wgpu-hal
    --exclude gpux-wgpu-core-deps-apple --exclude gpux-wgpu-core-deps-emscripten
    --exclude gpux-wgpu-core-deps-wasm --exclude gpux-wgpu-core-deps-windows-linux-android
    --exclude gpux-accesskit-macos
  LINUX_PACKAGES: >-
    pkg-config libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev
    libvulkan1 mesa-vulkan-drivers

jobs:
  # Chooses what runs: the manual inputs, or on a pull request its `ci:<job>` and `ci-os:<platform>`
  # labels and the files it changes (docs/ci.md).
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      os: ${{ steps.plan.outputs.os }}
      lane_c: ${{ steps.plan.outputs.lane_c }}
      grep: ${{ steps.plan.outputs.grep }}
      full: ${{ steps.plan.outputs.full }}
      skipped: ${{ steps.plan.outputs.skipped }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        uses: ./.github/actions/plan
        with:
          jobs: ${{ inputs.jobs }}
          platforms: ${{ inputs.platforms }}
          grep: ${{ inputs.grep }}
          full: ${{ inputs.full }}
          lane_c_jobs: ${{ inputs.lane-c-jobs }}
      - name: Report what lane C leaves out
        if: steps.plan.outputs.skipped != ''
        env:
          SKIPPED: ${{ steps.plan.outputs.skipped }}
        run: echo "::notice title=Lane C::$SKIPPED"

  check:
    name: check (${{ matrix.os }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'check')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Check every target
        # gpux-accesskit-macos builds only on Apple platforms; gpux-macos still checks it there.
        run: cargo check --workspace --all-targets --exclude gpux-accesskit-macos
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --no-deps ${{ env.FORK_EXCLUDES }} -- -D warnings
        shell: bash
      - name: Check the web platform
        if: runner.os == 'Linux'
        run: |
          cargo check -p gpux-web --target wasm32-unknown-unknown --no-default-features
          cargo check -p gpux-tests-conformance --target wasm32-unknown-unknown --no-default-features

  test:
    name: test (${{ matrix.os }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'test')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        # Linking every workspace test and example needs more room than the runner leaves free.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - name: Select lavapipe
        if: runner.os == 'Linux'
        run: echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"
      # GPU-backed tests create devices; running them concurrently hangs on DX12. The
      # conformance lanes run in their own jobs.
      - run: cargo test --workspace --no-fail-fast ${{ env.FORK_EXCLUDES }} --exclude gpux-tests-conformance -- --test-threads=1
        shell: bash

  lane-a:
    name: lane A (${{ matrix.os }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'lane-a')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      # The testkit runs lane A with every conformance group that needs no renderer.
      - name: Lane A and the conformance catalog
        env:
          GREP: ${{ needs.plan.outputs.grep }}
        run: cargo run -p gpux-testkit -- lane a ${GREP:+--grep "$GREP"}
        shell: bash

  lane-c:
    name: lane C (${{ matrix.backend }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'lane-c')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.lane_c) }}
    runs-on: ${{ matrix.os }}
    env:
      GPUX_WGPU_ADAPTER: software
      # Every scene must render on this backend, so a missing driver cannot skip the goldens.
      GPUX_EXPECT_BACKEND: ${{ matrix.backend }}
      GPUX_UPDATE_SNAPSHOTS: ${{ inputs.update-goldens && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - name: Select lavapipe
        if: runner.os == 'Linux'
        run: echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"
      - name: Lane C
        env:
          GREP: ${{ needs.plan.outputs.grep }}
          FULL: ${{ needs.plan.outputs.full }}
          JOBS: ${{ matrix.jobs }}
        # The testkit prints the mode (sampled or full) and the number of concurrent processes;
        # `--jobs` only applies to the whole lane, so a selection runs as one process.
        run: |
          args=()
          [ "$FULL" = true ] && args+=(--full)
          if [ -n "$GREP" ]; then args+=(--grep "$GREP"); else args+=(--jobs "$JOBS"); fi
          cargo run -p gpux-testkit -- lane c "${args[@]}"
        shell: bash
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lane-c-${{ matrix.backend }}-failures
          path: artifacts-temp/testkit/**
          if-no-files-found: ignore
      - name: Upload regenerated goldens
        # Probe failures elsewhere must not hold back the goldens this run wrote.
        if: ${{ !cancelled() && inputs.update-goldens }}
        uses: actions/upload-artifact@v7
        with:
          name: lane-c-${{ matrix.backend }}-goldens
          path: crates/gpux_tests_conformance/tests/goldens/${{ matrix.backend }}/

  lane-d:
    name: lane D (${{ matrix.os }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'lane-d')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    env:
      # A hosted Windows session may not deliver SendInput; the OS-input check then reports
      # itself skipped with the reason instead of failing.
      GPUX_OS_INPUT: ${{ matrix.os == 'windows-2025' && 'optional' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES xvfb xdotool
      - name: Select lavapipe
        if: runner.os == 'Linux'
        run: echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"
      - name: Lane D (X11 under Xvfb)
        if: runner.os == 'Linux'
        env:
          GREP: ${{ needs.plan.outputs.grep }}
        run: env -u WAYLAND_DISPLAY xvfb-run -a -s "-screen 0 1280x1024x24" cargo run -p gpux-testkit -- lane d ${GREP:+--grep "$GREP"}
      - name: Lane D
        if: runner.os != 'Linux'
        env:
          GREP: ${{ needs.plan.outputs.grep }}
        run: cargo run -p gpux-testkit -- lane d ${GREP:+--grep "$GREP"}
        shell: bash
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lane-d-${{ matrix.os }}-failures
          path: artifacts-temp/testkit/**
          if-no-files-found: ignore

  package:
    name: package
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'package')
    # Packaging verifies every crate by building it, and gpux-accesskit-macos builds only on
    # Apple platforms; the other platforms' crates build on macOS as their target-gated selves.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo package --workspace
