name: Gpux

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-goldens:
        description: Regenerate the lane C goldens of each backend and upload them as artifacts
        type: boolean
        default: false

# A new push to a pull request cancels its superseded run; runs on main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Full debug info makes the workspace's test and example binaries outgrow the Linux runner's
  # disk; line tables keep backtraces readable.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # The gpux-wgpu fork crates are upstream wgpu sources; gpux does not lint or test them.
  FORK_EXCLUDES: >-
    --exclude gpux-wgpu --exclude gpux-wgpu-core --exclude gpux-wgpu-hal
    --exclude gpux-wgpu-core-deps-apple --exclude gpux-wgpu-core-deps-emscripten
    --exclude gpux-wgpu-core-deps-wasm --exclude gpux-wgpu-core-deps-windows-linux-android
  LINUX_PACKAGES: >-
    pkg-config libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev
    libvulkan1 mesa-vulkan-drivers

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Check every target
        run: cargo check --workspace --all-targets
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --no-deps ${{ env.FORK_EXCLUDES }} -- -D warnings
        shell: bash
      - name: Check the web platform
        if: runner.os == 'Linux'
        run: |
          cargo check -p gpux-web --target wasm32-unknown-unknown --no-default-features
          cargo check -p gpux-conformance --target wasm32-unknown-unknown --no-default-features

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 joins once the macos-only-metal-port-and-ci-repair epic lands.
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        # Linking every workspace test and example needs more room than the runner leaves free.
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - name: Select lavapipe
        if: runner.os == 'Linux'
        run: echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"
      # GPU-backed tests create devices; running them concurrently hangs on DX12. The
      # conformance lanes run in their own jobs.
      - run: cargo test --workspace ${{ env.FORK_EXCLUDES }} --exclude gpux-conformance -- --test-threads=1
        shell: bash

  lane-a:
    name: lane A (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macos-15 joins once the macos-only-metal-port-and-ci-repair epic lands.
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - name: Lane A and the conformance catalog
        run: >-
          cargo test -p gpux-conformance --test lane_a --test catalog_coverage
          --test image_compare --test golden_policy

  lane-c:
    name: lane C (${{ matrix.backend }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: lavapipe
          - os: windows-2025
            backend: warp
          # macos-15 with metal joins once the macos-only-metal-port-and-ci-repair epic lands.
    runs-on: ${{ matrix.os }}
    env:
      GPUX_WGPU_ADAPTER: software
      # Every scene must render on this backend, so a missing driver cannot skip the goldens.
      GPUX_EXPECT_BACKEND: ${{ matrix.backend }}
      GPUX_UPDATE_SNAPSHOTS: ${{ inputs.update-goldens && '1' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - name: Select lavapipe
        if: runner.os == 'Linux'
        run: echo "VK_DRIVER_FILES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -n 1)" >> "$GITHUB_ENV"
      - name: Lane C
        run: cargo test -p gpux-conformance --test lane_c -- --test-threads=1
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lane-c-${{ matrix.backend }}-failures
          path: artifacts-temp/testkit/**
          if-no-files-found: ignore
      - name: Upload regenerated goldens
        if: inputs.update-goldens
        uses: actions/upload-artifact@v7
        with:
          name: lane-c-${{ matrix.backend }}-goldens
          path: crates/gpux_conformance/tests/goldens/${{ matrix.backend }}/

  package:
    name: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - run: cargo package --workspace
