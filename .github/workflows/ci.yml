name: Gpux

on:
  pull_request:
  push:
    branches: [main]

env:
  # The gpux-wgpu fork crates are upstream wgpu sources; gpux does not lint or test them.
  FORK_EXCLUDES: >-
    --exclude gpux-wgpu --exclude gpux-wgpu-core --exclude gpux-wgpu-hal
    --exclude gpux-wgpu-core-deps-apple --exclude gpux-wgpu-core-deps-emscripten
    --exclude gpux-wgpu-core-deps-wasm --exclude gpux-wgpu-core-deps-windows-linux-android

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Check every target
        run: cargo check --workspace --all-targets
      - name: Clippy
        if: runner.os == 'Windows'
        run: cargo clippy --workspace --all-targets --no-deps ${{ env.FORK_EXCLUDES }} -- -D warnings
        shell: bash
      - name: Check the web platform
        if: runner.os == 'Linux'
        run: cargo check -p gpux-web --target wasm32-unknown-unknown --no-default-features

  test:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      # GPU-backed tests create devices; running them concurrently hangs on DX12.
      - run: cargo test --workspace ${{ env.FORK_EXCLUDES }} -- --test-threads=1
        shell: bash

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev
      - run: cargo package --workspace
