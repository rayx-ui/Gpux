name: Gpux lane E

# Lane E: the Android conformance host on an x86_64 emulator. Hosted ubuntu runners give
# emulators hardware acceleration through KVM (GitHub changelog, 2024-04-02); the emulator
# renders through SwiftShader, so the host runs on the GL fallback and its pixel steps read the
# screen.

on:
  pull_request:
    paths:
      - crates/gpui_mobile/**
      - crates/gpui_wgpu/**
      - crates/gpux_tests_conformance/**
      - tools/android/**
      - tools/testkit/**
      - .github/workflows/lane-e.yml
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: Select the checks and scenes by name (`gpux-testkit --grep`; no spaces)
        default: ''

# A new push to a pull request cancels its superseded run; scheduled and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  LINUX_PACKAGES: >-
    pkg-config libfreetype6-dev libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev
  # The pinned SDK pieces `gpux-testkit android build` checks for (tools/testkit/src/android.rs).
  ANDROID_PACKAGES: >-
    ndk;28.0.12674087 build-tools;36.0.0 platforms;android-36 platform-tools

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      grep: ${{ steps.plan.outputs.grep }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        uses: ./.github/actions/plan
        with:
          jobs: lane-e
          grep: ${{ inputs.grep }}

  lane-e:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'lane-e')
    # The emulator draws in software: a frame takes seconds on a loaded runner and the host runs
    # for the better part of an hour (RUN_TIMEOUT in tools/testkit/src/android.rs is 45 minutes).
    timeout-minutes: 90
    name: lane E (emulator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: x86_64-linux-android
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_PACKAGES
      - name: Install the pinned Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" $ANDROID_PACKAGES
          # The runner image points ANDROID_NDK_HOME at its own NDK; build with the pinned one.
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12674087" >> "$GITHUB_ENV"
      # Lane E builds the NativeActivity host; the embedded host is the default feature set.
      - name: Type-check gpux-mobile's default Android build
        run: cargo check -p gpux-mobile --target x86_64-linux-android
      - name: Build the host
        run: cargo run -p gpux-testkit -- android build --abi x86_64
      - name: Lane E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # A small screen keeps software rendering fast.
          profile: Nexus 4
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: cargo run -p gpux-testkit -- lane e ${{ needs.plan.outputs.grep && format('--grep {0}', needs.plan.outputs.grep) || '' }}
      - name: Upload logcat, screenshots and failure frames
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lane-e
          path: artifacts-temp/testkit/e
          if-no-files-found: ignore
          retention-days: 14
