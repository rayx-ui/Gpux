name: Gpux lane F

# Lane F: the iOS conformance host on a Simulator of the macOS runner. `gpux-testkit lane f`
# builds the host for the Simulator, generates and builds the Xcode project of tools/ios
# unsigned, boots the pinned Simulator, and follows the host's console. Where the hosted
# Simulator offers no Metal device, pixel steps report themselves skipped with the reason.

on:
  pull_request:
    paths:
      - crates/gpui_mobile/**
      - crates/gpui_wgpu/**
      - crates/gpux_tests_conformance/**
      - tools/ios/**
      - tools/testkit/**
      - .github/workflows/lane-f.yml
  schedule:
    - cron: '37 22 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: Select the checks and scenes by name (`gpux-testkit --grep`; no spaces)
        default: ''

# A new push to a pull request cancels its superseded run; scheduled and manual runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      grep: ${{ steps.plan.outputs.grep }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        uses: ./.github/actions/plan
        with:
          jobs: lane-f
          grep: ${{ inputs.grep }}

  lane-f:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.jobs), 'lane-f')
    name: lane F (Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-apple-ios-sim
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Lane F
        env:
          GREP: ${{ needs.plan.outputs.grep }}
        run: cargo run -p gpux-testkit -- lane f ${GREP:+--grep "$GREP"}
      - name: Upload the console and failure frames
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: lane-f
          path: artifacts-temp/testkit/f
          if-no-files-found: ignore
          retention-days: 14
