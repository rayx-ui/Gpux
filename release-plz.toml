# release-plz: releases the whole gpux workspace as ONE version under ONE tag `vX.Y.Z`, with one root
# CHANGELOG.md and one GitHub Release. It keeps a release pull request with the version bump and the
# CHANGELOG.md section open on `main`; merging it makes the next `release` run tag `vX.Y.Z` and
# create the GitHub Release. See docs/releasing.md, which also records how this file was proven.
#
# 1.x policy (while the owner is the only consumer): `fix`/`perf` -> patch, `feat` -> minor. Never
# write `!` or a `BREAKING CHANGE:` footer (release-plz would propose 2.0.0): breaking work, Zed
# imports included, is a `feat` whose body states the break, with RayX notes in a `Migration:`
# footer, which the changelog prints under the commit.

[workspace]
# Versions come from git tags; nothing goes to a registry (the manifests stay publishable).
git_only = true
publish = false
git_tag_name = "v{{ version }}"
# Every Zed import breaks API; the 1.x policy decides the bump, not cargo-semver-checks.
semver_check = false
# Only changes that reach users start a release; docs, tests, CI, refactors and agentx commits
# ride along in the next one.
release_commits = "^(feat|fix|perf)"
# Off by default: only `gpux` below tags, creates the GitHub Release and writes the changelog, so a
# package missing from this file can never tag `vX.Y.Z` by itself (release_config.rs reports it).
git_tag_enable = false
git_release_enable = false
changelog_update = false

# The workspace's one tag, Release and changelog. Its section lists the commits of every own package.
[[package]]
name = "gpux"
version_group = "gpux"
git_tag_enable = true
git_release_enable = true
# The default Release name would be `gpux-vX.Y.Z`.
git_release_name = "v{{ version }}"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = [
  "gpux-apple",
  "gpux-bench-metrics",
  "gpux-collections",
  "gpux-color",
  "gpux-derive-refineable",
  "gpux-devtools",
  "gpux-devtools-mcp",
  "gpux-fonts",
  "gpux-http-client",
  "gpux-http-client-tls",
  "gpux-linux",
  "gpux-macos",
  "gpux-macros",
  "gpux-mobile",
  "gpux-path",
  "gpux-perf",
  "gpux-platform",
  "gpux-refineable",
  "gpux-reqwest-client",
  "gpux-scheduler",
  "gpux-shared-string",
  "gpux-sum-tree",
  "gpux-testkit",
