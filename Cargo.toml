perf = { package = "gpux-perf", path = "tools/perf", version = "1.0.0" }
refineable = { package = "gpux-refineable", path = "crates/refineable", version = "1.0.0" }
reqwest_client = { package = "gpux-reqwest-client", path = "crates/reqwest_client", version = "1.0.0" }
scheduler = { package = "gpux-scheduler", path = "crates/scheduler", version = "1.0.0" }
sum_tree = { package = "gpux-sum-tree", path = "crates/sum_tree", version = "1.0.0" }
util = { package = "gpux-zed-util", path = "crates/util", version = "1.0.0" }
util_macros = { package = "gpux-zed-util-macros", path = "crates/util_macros", version = "1.0.0" }
