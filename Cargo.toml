[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

# `cargo test` (and so every lane the testkit runs) builds at level 1: lane C renders and compares
# hundreds of thousands of frames, and at level 0 more than half of that time goes to unoptimized
# std and `image` debug-assertion checks. The checks themselves stay on. The scope is measured in
# docs/measurements/lane-c-timings.md; `cargo run` and debugging keep `[profile.dev]`.
[profile.test]
opt-level = 1
debug-assertions = true
overflow-checks = true
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

# Read by rayx (from its release with the library-agnostic contract on) for apps built in this
# workspace: lane E's Android pins (tools/testkit/src/android.rs, lane-e.yml).
# tools/testkit/tests/rayx_declarations.rs keeps them equal.
[workspace.metadata.rayx]
android-platform = "android-36"
android-build-tools = "36.0.0"
android-ndk = "28.0.12674087"

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"
