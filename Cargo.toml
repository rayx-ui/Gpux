[workspace]
resolver = "2"
members = [
    "crates/bench_metrics",
    "crates/collections",
    "crates/gpui",
    "crates/gpui_apple",
    "crates/gpux_color",
    "crates/gpux_devtools",
    "crates/gpux_devtools_mcp",
    "crates/gpux_fonts",
    "crates/gpux_tests_conformance",
    "crates/gpui_linux",
    "crates/gpui_macos",
    "crates/gpui_macros",
    "crates/gpui_mobile",
    "crates/gpui_platform",
    "crates/gpui_shared_string",
    "crates/gpui_util",
    "crates/gpui_web",
    "crates/gpui_wgpu",
    "crates/gpui_windows",
    "crates/http_client",
    "crates/http_client_tls",
    "crates/path",
    "crates/refineable",
    "crates/refineable/derive_refineable",
    "crates/reqwest_client",
    "crates/scheduler",
    "crates/sum_tree",
    "crates/util",
    "crates/util_macros",
    "tools/perf",
    "tools/testkit",
    "vendor/accesskit_macos",
    "vendor/wgpu/wgpu",
    "vendor/wgpu/wgpu-core",
    "vendor/wgpu/wgpu-hal",
    "vendor/wgpu/wgpu-core-deps-apple",
    "vendor/wgpu/wgpu-core-deps-emscripten",
    "vendor/wgpu/wgpu-core-deps-wasm",
    "vendor/wgpu/wgpu-core-deps-windows-linux-android",
]
default-members = ["crates/gpui"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/rayx-ui/Gpux"
homepage = "https://github.com/rayx-ui/Gpux"

[workspace.dependencies]
bench_metrics = { package = "gpux-bench-metrics", path = "crates/bench_metrics", version = "1.0.0" }
collections = { package = "gpux-collections", path = "crates/collections", version = "1.0.0" }
derive_refineable = { package = "gpux-derive-refineable", path = "crates/refineable/derive_refineable", version = "1.0.0" }
gpux = { path = "crates/gpui", version = "1.0.0", default-features = false }
gpux_color = { package = "gpux-color", path = "crates/gpux_color", version = "1.0.0" }
gpux_devtools = { package = "gpux-devtools", path = "crates/gpux_devtools", version = "1.0.0" }
gpux_devtools_mcp = { package = "gpux-devtools-mcp", path = "crates/gpux_devtools_mcp", version = "1.0.0" }
gpux_fonts = { package = "gpux-fonts", path = "crates/gpux_fonts", version = "1.0.0" }
gpux_tests_conformance = { package = "gpux-tests-conformance", path = "crates/gpux_tests_conformance", version = "1.0.0", default-features = false }
gpui_shared_string = { package = "gpux-shared-string", path = "crates/gpui_shared_string", version = "1.0.0" }
gpui_apple = { package = "gpux-apple", path = "crates/gpui_apple", version = "1.0.0" }
gpui_linux = { package = "gpux-linux", path = "crates/gpui_linux", version = "1.0.0", default-features = false }
gpui_macos = { package = "gpux-macos", path = "crates/gpui_macos", version = "1.0.0", default-features = false }
gpui_macros = { package = "gpux-macros", path = "crates/gpui_macros", version = "1.0.0" }
gpui_mobile = { package = "gpux-mobile", path = "crates/gpui_mobile", version = "1.0.0", default-features = false }
gpui_platform = { package = "gpux-platform", path = "crates/gpui_platform", version = "1.0.0", default-features = false }
gpui_web = { package = "gpux-web", path = "crates/gpui_web", version = "1.0.0", default-features = false }
gpui_wgpu = { package = "gpux-wgpu-renderer", path = "crates/gpui_wgpu", version = "1.0.0" }
gpui_windows = { package = "gpux-windows", path = "crates/gpui_windows", version = "1.0.0", default-features = false }
gpui_util = { package = "gpux-util", path = "crates/gpui_util", version = "1.0.0" }
http_client = { package = "gpux-http-client", path = "crates/http_client", version = "1.0.0" }
http_client_tls = { package = "gpux-http-client-tls", path = "crates/http_client_tls", version = "1.0.0" }
