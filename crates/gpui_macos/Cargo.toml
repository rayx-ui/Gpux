[package]
name = "gpux-macos"
description = "macOS platform for gpux."
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "gpui_macos"
path = "src/gpui_macos.rs"
doctest = false

[features]
default = ["gpux/default", "accessibility"]
# Links the VoiceOver adapter (`accesskit_macos`). Without it the window never turns the platform
# accessibility source on; inspection and `AccessibilityMode::Always` still build the tree.
accessibility = ["dep:accesskit_macos"]
bench-support = ["gpux/bench-support", "gpui_apple/bench-support"]
test-support = ["gpux/test-support", "gpui_apple/test-support", "accessibility"]
runtime_shaders = ["gpui_apple/runtime_shaders"]
font-kit = ["dep:font-kit", "dep:core-text", "dep:pathfinder_geometry"]
screen-capture = ["gpux/screen-capture", "dep:objc2-core-graphics", "dep:objc2-core-media", "dep:objc2-screen-capture-kit"]

[dependencies]
gpux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
accesskit.workspace = true
accesskit_macos = { workspace = true, optional = true }
anyhow.workspace = true
block2.workspace = true
cocoa.workspace = true
collections.workspace = true
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics.workspace = true
core-text = { workspace = true, optional = true }
core-video.workspace = true
ctor.workspace = true
dispatch2 = { workspace = true, features = ["block2", "objc2"] }
font-kit = { workspace = true, optional = true, features = ["source"] }
foreign-types.workspace = true
futures.workspace = true
gpui_apple.workspace = true
gpui_util.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
objc.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-core-graphics = { workspace = true, optional = true }
objc2-core-media = { workspace = true, optional = true }
objc2-foundation.workspace = true
objc2-screen-capture-kit = { workspace = true, optional = true }
objc2-user-notifications.workspace = true
parking_lot.workspace = true
pathfinder_geometry = { workspace = true, optional = true }
raw-window-handle.workspace = true
scheduler.workspace = true
semver.workspace = true
smallvec.workspace = true
strum.workspace = true
uuid.workspace = true

# The macOS test-only window implementation depends on test-only APIs from both
# gpux and the extracted renderer. A dependency does not inherit this crate's
# `cfg(test)`, so dev-dependencies enable those APIs only for test builds.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpux = { workspace = true, features = ["test-support"] }
gpui_apple = { workspace = true, features = ["test-support"] }
