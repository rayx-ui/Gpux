[package]
name = "gpux-windows"
description = "Windows platform for gpux."
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "gpui_windows"
path = "src/gpui_windows.rs"

[features]
default = ["gpux/default"]
test-support = ["gpux/test-support"]
screen-capture = ["gpux/screen-capture", "scap"]

[dependencies]
gpux.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
accesskit.workspace = true
accesskit_windows.workspace = true
anyhow.workspace = true
collections.workspace = true
dunce.workspace = true
etagere.workspace = true
futures.workspace = true
image.workspace = true
gpui_wgpu.workspace = true
gpui_util.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
rand.workspace = true
raw-window-handle = "0.6"
smallvec.workspace = true
util.workspace = true
uuid.workspace = true
windows = { workspace = true, features = ["Win32_UI_Accessibility"] }
windows-core.workspace = true
windows-numerics = "0.2"
windows-registry = "0.5"

[target.'cfg(target_os = "windows")'.build-dependencies]
windows-registry = "0.5"

[target.'cfg(target_os = "windows")'.dependencies.scap]
workspace = true
optional = true
