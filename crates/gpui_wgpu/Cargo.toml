[package]
name = "gpux-wgpu-renderer"
description = "wgpu renderer and cosmic-text text system for gpux platforms."
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "gpui_wgpu"
path = "src/gpui_wgpu.rs"
doctest = false

[features]
default = []
bench-support = ["gpux/bench-support"]
font-kit = ["dep:font-kit"]
diagnostics = ["gpux/diagnostics"]
# The former name of `diagnostics`; it also publishes the legacy `__rayx*` browser globals.
rayx_diagnostics = ["diagnostics", "gpux/rayx_diagnostics"]
test-support = ["gpux/test-support"]

[dependencies]
gpux.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
collections.workspace = true
cosmic-text = "0.19.0"
etagere.workspace = true
image.workspace = true
itertools.workspace = true
log.workspace = true
parking_lot.workspace = true
profiling.workspace = true
raw-window-handle.workspace = true
smallvec.workspace = true
swash.workspace = true
unicode-bidi.workspace = true
unicode-segmentation.workspace = true
gpui_util.workspace = true

# Optional: only needed on platforms with multiple font sources (e.g. Linux)
font-kit = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
wgpu = { workspace = true, features = ["std", "parking_lot", "metal", "gles", "vulkan", "wgsl", "webgpu"] }

[target.'cfg(not(any(target_os = "linux", target_os = "freebsd")))'.dependencies]
wgpu = { workspace = true, default-features = true }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "CanvasRenderingContext2d",
    "Document",
    "HtmlCanvasElement",
    "HtmlElement",
] }
js-sys.workspace = true
wgpu = { workspace = true, features = ["webgl"] }

[dev-dependencies]
criterion.workspace = true
gpux = { workspace = true, features = ["bench-support"] }
gpux_fonts.workspace = true
naga = { version = "30.0.1", features = ["wgsl-in"] }

[[test]]
name = "headless_renderer"
required-features = ["test-support"]

[[bench]]
name = "layout_line"
harness = false
