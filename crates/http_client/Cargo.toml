[package]
name = "gpux-http-client"
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "A HTTP client library for Zed and GPUI"

[lints]
workspace = true

[features]
test-support = ["dep:log"]
github-download = [
    "dep:async-compression",
    "dep:async-fs",
    "dep:async-tar",
    "dep:sha2",
    "dep:tempfile",
    "dep:util",
]

[lib]
name = "http_client"
path = "src/http_client.rs"
doctest = false

[dependencies]
anyhow.workspace = true
bytes.workspace = true
futures.workspace = true
http-body.workspace = true
http.workspace = true
log = { workspace = true, optional = true }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
url.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
log.workspace = true
async-compression = { workspace = true, optional = true }
util = { workspace = true, optional = true }
async-fs = { workspace = true, optional = true }
async-tar = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
