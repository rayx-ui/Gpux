[package]
name = "gpux-web"
description = "Browser platform (WebGPU with a WebGL fallback) for gpux."
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
autoexamples = false

[lints]
workspace = true

[features]
default = ["multithreaded", "accessibility"]
# The screen-reader DOM mirror. Without it the window never turns the platform accessibility
# source on; inspection and `AccessibilityMode::Always` still build the tree.
accessibility = []
multithreaded = ["dep:wasm_thread", "scheduler/wasm-threads"]
diagnostics = ["gpui_wgpu/diagnostics"]
# The former name of `diagnostics`; it also publishes the legacy `__rayx*` browser globals.
rayx_diagnostics = ["diagnostics", "gpui_wgpu/rayx_diagnostics"]

[lib]
name = "gpui_web"
path = "src/gpui_web.rs"
doctest = false

[dependencies]
unicode-properties = "=0.1.3"
unicode-script.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(target_family = "wasm")'.dependencies]
gpux.workspace = true
scheduler.workspace = true
parking_lot = { workspace = true, features = ["nightly"] }
gpui_wgpu.workspace = true
gpux_fonts.workspace = true
http_client.workspace = true
anyhow.workspace = true
futures.workspace = true
log.workspace = true
smallvec.workspace = true
uuid.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-time.workspace = true
console_error_panic_hook.workspace = true
js-sys.workspace = true
raw-window-handle.workspace = true
wasm_thread = { workspace = true, optional = true }
web-sys = { workspace = true, features = [
    "console",
    "Blob",
    "Clipboard",
    "ClipboardEvent",
    "ClipboardItem",
    "CompositionEvent",
    "CssStyleDeclaration",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
    "Document",
    "DomRect",
    "DragEvent",
    "Element",
    "EventTarget",
    "File",
    "FileList",
    "FocusOptions",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "IdleDeadline",
    "IdleRequestOptions",
    "ImageData",
    "InputEvent",
    "KeyboardEvent",
    "Location",
    "MediaQueryList",
    "MediaQueryListEvent",
    "MouseEvent",
    "Navigator",
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "PointerEvent",
    "Range",
    "Performance",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "ResizeObserver",
    "ResizeObserverBoxOptions",
    "ResizeObserverEntry",
    "ResizeObserverSize",
    "ResizeObserverOptions",
    "Screen",
    "Selection",
    "Storage",
    "TextMetrics",
    "VisualViewport",
    "Headers",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestRedirect",
    "Response",
    "WheelEvent",
    "Window",
] }

[dev-dependencies]
anyhow.workspace = true
gpux.workspace = true
smallvec.workspace = true

[package.metadata.cargo-shear]
ignored = ["scheduler"]
