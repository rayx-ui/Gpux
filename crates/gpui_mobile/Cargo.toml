[package]
name = "gpux-mobile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors = ["Balamurali Pandranki <balamurali@live.com>"]
description = "Mobile platform support for gpux on iOS and Android."
repository.workspace = true
homepage.workspace = true
keywords = ["gui", "mobile", "ios", "android", "gpui"]
categories = ["gui", "os"]
readme = "README.md"

[lints]
workspace = true

[features]
default = ["accessibility"]
# The VoiceOver (`accesskit_ios`) and TalkBack (`accesskit_android`) adapters. Without it the window
# never turns the platform accessibility source on; inspection and `AccessibilityMode::Always` still
# build the tree.
accessibility = ["dep:accesskit", "dep:accesskit_ios", "dep:accesskit_android", "dep:jni-021"]
# Counters hosts report (`PlatformWindow::layer_tile_counters`).
diagnostics = ["gpui/diagnostics", "gpui_wgpu/diagnostics"]
android-native-activity = ["android-activity/native-activity"]
audio = []
battery = []
calendar = []
camera = []
clipboard = []
connectivity = []
contacts = []
deeplink = []
device_info = []
file_selector = []
image_picker = []
in_app_review = []
local_auth = []
location = []
maps = []
maps_launcher = []
media_session = []
microphone = []
network_info = []
notifications = []
package_info = []
path_provider = []
permission_handler = []
sensors = []
share = []
shared_preferences = []
url_launcher = []
vibration = []
video_player = []
webview = []

[lib]
name = "gpui_mobile"

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui = { package = "gpux", path = "../gpui", version = "0.3.0", default-features = false }
gpui_wgpu = { workspace = true }
log.workspace = true
parking_lot.workspace = true
raw-window-handle = "0.6"
accesskit = { workspace = true, optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
# On objc2 0.5; it meets gpux's objc2 0.6 only through the view's raw pointer.
accesskit_ios = { workspace = true, optional = true }
block2 = "0.6"
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics = "0.24"
core-text = "21"
font-kit = { package = "zed-font-kit", version = "0.14.1-zed" }
gpui_wgpu = { workspace = true, features = ["font-kit"] }
image.workspace = true
objc2 = "0.6"
pathfinder_geometry = "0.5"
smallvec.workspace = true
uuid = { workspace = true, features = ["v4", "v5"] }
wgpu.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# On jni 0.21; it meets gpux's jni 0.22 only through the raw VM, environment and view handles.
accesskit_android = { workspace = true, optional = true }
jni-021 = { package = "jni", version = "0.21.1", optional = true }
android-activity = { version = "0.6", optional = true, default-features = false }
android_logger = "0.15"
image.workspace = true
jni = "0.22"
jni-sys-03 = { package = "jni-sys", version = "0.3" }
libc.workspace = true
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys = "0.6"
rustc-hash.workspace = true
uuid = { workspace = true, features = ["v5"] }
