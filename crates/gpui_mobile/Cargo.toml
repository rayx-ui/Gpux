[package]
name = "gpui_mobile"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later OR AGPL-3.0-or-later OR Apache-2.0"
authors = ["Balamurali Pandranki <balamurali@live.com>"]
description = "Mobile platform support for gpux on iOS and Android."
repository = "https://github.com/itsbalamurali/gpui-mobile"
homepage = "https://github.com/itsbalamurali/gpui-mobile"
keywords = ["gui", "mobile", "ios", "android", "gpui"]
categories = ["gui", "os"]
readme = "README.md"

[lints]
workspace = true

[features]
default = []
android-native-activity = ["android-activity/native-activity"]

[dependencies]
anyhow.workspace = true
futures.workspace = true
gpui = { package = "gpux", path = "../gpui", default-features = false }
log.workspace = true
parking_lot.workspace = true
raw-window-handle = "0.6"

[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
core-foundation.workspace = true
core-foundation-sys.workspace = true
core-graphics = "0.24"
core-text = "21"
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed" }
gpui_wgpu = { workspace = true, features = ["font-kit"] }
objc2 = "0.6"
pathfinder_geometry = "0.5"
smallvec.workspace = true
uuid.workspace = true
wgpu.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", optional = true, default-features = false }
android_logger = "0.15"
gpui_wgpu = { workspace = true, features = ["font-kit"] }
jni = "0.22"
jni-sys-03 = { package = "jni-sys", version = "0.3" }
libc.workspace = true
ndk = { version = "0.9", features = ["nativewindow"] }
ndk-context = "0.1"
ndk-sys = "0.6"
rustc-hash.workspace = true
uuid.workspace = true
