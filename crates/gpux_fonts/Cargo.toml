[package]
name = "gpux-fonts"
description = "The IBM Plex Sans and Lilex fonts bundled with gpux."
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license = "OFL-1.1"
keywords = ["gpux", "fonts", "ibm-plex", "lilex"]
categories = ["gui"]

[lints]
workspace = true

# Read by rayx from its release with the library-agnostic contract on: the fonts are a
# rayx asset package. Kept equal to the contract by tools/testkit/tests/rayx_declarations.rs.
[package.metadata.rayx.assets]
manifest = "rayx.assets.toml"
