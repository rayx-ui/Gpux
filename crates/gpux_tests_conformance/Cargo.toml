[package]
name = "gpux-tests-conformance"
description = "The gpux conformance scene catalog, its test hosts and image comparison: gpux's own proof on every platform."
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
keywords = ["gpux", "testing", "conformance"]
categories = ["gui", "development-tools::testing"]
# Goldens are per-backend test data; consumers of the published crate do not need them.
exclude = ["tests/goldens/**"]

[lints]
workspace = true

[lib]
name = "gpux_tests_conformance"
path = "src/gpux_tests_conformance.rs"
doctest = false

[features]
default = ["test-host"]
# The test-platform host: lane A behaviour and lane C offscreen pixels. Native only.
# The in-app host: scenes in real windows of a running application (lane D, and the browser
# and mobile hosts).
app-host = ["dep:gpux_fonts"]
# The browser host's diagnostics globals, which the browser specs read (`__gpuxFastStats`).
diagnostics = ["gpux/diagnostics", "gpui_platform/diagnostics"]
test-host = [
    "dep:gpui_platform",
    "dep:gpui_wgpu",
    "gpux/test-support",
    "gpui_platform/test-support",
]

[dependencies]
anyhow.workspace = true
gpux = { workspace = true, features = ["devtools"] }
gpux_fonts = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
image.workspace = true

# Lane C picks the wgpu headless adapter itself on the platforms that render through wgpu.
[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
gpui_wgpu = { workspace = true, optional = true }

[dev-dependencies]
# `font-kit` gives macOS its CoreText text system; without it macOS windows render no text.
gpui_platform = { workspace = true, features = ["font-kit", "x11", "wayland"] }
raw-window-handle.workspace = true
tempfile.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
log.workspace = true
x11rb = { version = "0.13.1", features = ["shape"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
gpui_wgpu.workspace = true
pollster.workspace = true
windows = { workspace = true, features = [
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
core-graphics.workspace = true
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true

[target.'cfg(target_family = "wasm")'.dev-dependencies]
console_error_panic_hook.workspace = true
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm_thread.workspace = true
web-sys = { workspace = true, features = ["console", "Location", "UrlSearchParams", "Window"] }

[target.'cfg(target_os = "android")'.dev-dependencies]
android-activity = { version = "0.6", default-features = false, features = ["native-activity"] }
jni = "0.22"
gpui_mobile = { workspace = true, features = ["android-native-activity"] }
libc.workspace = true
log.workspace = true

[target.'cfg(target_os = "ios")'.dev-dependencies]
gpui_mobile.workspace = true
objc2.workspace = true

[[example]]
name = "android_host"
path = "examples/android_host/lib.rs"
crate-type = ["cdylib"]
required-features = ["app-host"]

[[example]]
name = "ios_host"
path = "examples/ios_host/lib.rs"
crate-type = ["staticlib"]
required-features = ["app-host"]

[[example]]
name = "web_host"
path = "examples/web_host/lib.rs"
crate-type = ["cdylib"]
required-features = ["app-host"]

[[example]]
name = "desktop_host"
path = "examples/desktop_host/main.rs"
required-features = ["app-host"]
