[package]
name = "gpux-linux"
description = "Linux platform (Wayland and X11) for gpux."
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "gpui_linux"
path = "src/gpui_linux.rs"
doctest = false

[features]
default = ["wayland", "x11", "accessibility"]
# Links the AT-SPI adapter (`accesskit_unix`) for the Wayland and X11 windows. Without it no window
# turns the platform accessibility source on; inspection and `AccessibilityMode::Always` still
# build the tree.
accessibility = ["dep:accesskit_unix"]
test-support = ["gpux/test-support", "accessibility"]
wayland = [
    "gpui_wgpu",
    "ashpd/wayland",

    "calloop-wayland-source",
    "wayland-backend",
    "wayland-client",
    "wayland-cursor",
    "wayland-protocols",
    "wayland-protocols-plasma",
    "wayland-protocols-wlr",
    "filedescriptor",
    "xkbcommon/wayland",
    "open",
    "gpux/wayland",
    "uuid/v5",
]
x11 = [
    "gpui_wgpu",
    "ashpd",

    "as-raw-xcb-connection",
    "x11rb",
    "xkbcommon/x11",
    "xim",
    "filedescriptor",
    "open",
    "scap?/x11",
]
screen-capture = [
    "gpux/screen-capture",
    "scap",
]


[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
accesskit.workspace = true
accesskit_unix = { workspace = true, optional = true }
anyhow.workspace = true
bytemuck.workspace = true
collections.workspace = true
futures.workspace = true
gpux.workspace = true
gpui_util.workspace = true
gpui_wgpu = { workspace = true, optional = true, features = ["font-kit"] }
http_client.workspace = true
image.workspace = true
libc.workspace = true
log.workspace = true
parking_lot.workspace = true
smallvec.workspace = true
smol.workspace = true
strum.workspace = true
url.workspace = true
uuid.workspace = true

# Always used
oo7 = { workspace = true, features = [
    "async-std",
    "native_crypto",
] }
calloop = "0.14.3"
notify-rust.workspace = true
raw-window-handle.workspace = true

# Used in both windowing options
ashpd = { workspace = true, optional = true }
filedescriptor = { version = "0.8.2", optional = true }
open = { version = "5.2.0", optional = true }
xkbcommon = { workspace = true, optional = true }

# Screen capture
scap = { workspace = true, optional = true }

# Wayland
calloop-wayland-source = { version = "0.4.1", optional = true }
wayland-backend = { version = "0.3.15", features = [
    "client_system",
    "dlopen",
    "log",
], optional = true }
wayland-client = { version = "0.31.11", optional = true }
wayland-cursor = { version = "0.31.11", optional = true }
wayland-protocols = { version = "0.32.9", features = [
    "client",
    "staging",
    "unstable",
], optional = true }
wayland-protocols-plasma = { version = "0.3.9", features = [
    "client",
], optional = true }
wayland-protocols-wlr = { version = "0.3.9", features = [
    "client",
], optional = true }

# X11
as-raw-xcb-connection = { version = "1", optional = true }
x11rb = { version = "0.13.1", features = [
    "allow-unsafe-code",
    "xkb",
    "randr",
    "xinput",
    "cursor",
    "resource_manager",
    "sync",
    "dri3",
    "shape",
], optional = true }
xim = { features = [
    "x11rb-xcb",
    "x11rb-client",
], package = "zed-xim", version = "0.4.0-zed", optional = true }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
gpux = { workspace = true, features = ["test-support"] }

[package.metadata.cargo-shear]
ignored = ["scap"]
