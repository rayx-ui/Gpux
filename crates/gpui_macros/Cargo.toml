[package]
name = "gpux-macros"
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Macros used by gpux"

[lints]
workspace = true

[features]
inspector = []

[lib]
name = "gpui_macros"
path = "src/gpui_macros.rs"
proc-macro = true
doctest = true
test = false

[dependencies]
heck.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn = { workspace = true, default-features = true, features = ["full", "extra-traits", "visit-mut"] }

[dev-dependencies]
gpux = { path = "../gpui", features = ["inspector", "test-support"] }
proptest.workspace = true
