[package]
name = "gpux-platform"
description = "Selects the gpux platform for the compilation target."
version.workspace = true
edition.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[lib]
name = "gpui_platform"
path = "src/gpui_platform.rs"
doctest = false

[features]
default = []
# Benchmarks shape and draw text with the platform's real text system; on macOS that is the
# CoreText one behind `font-kit`, without which macOS text draws nothing.
bench-support = ["gpux/bench-support", "gpui_macos/bench-support", "gpui_wgpu/bench-support", "font-kit"]
font-kit = ["gpui_macos/font-kit"]
inspector = ["gpux/inspector"]
# Publishes the browser's diagnostics globals (`__gpuxFastStats` among them).
diagnostics = ["gpux/diagnostics", "gpui_web/diagnostics", "gpui_mobile/diagnostics"]
test-support = [
    "gpux/test-support",
    "gpui_macos/test-support",
    "gpui_windows/test-support",
    "gpui_wgpu/test-support",
    "dep:gpux_fonts",
]
screen-capture = ["gpux/screen-capture", "gpui_macos/screen-capture", "gpui_windows/screen-capture", "gpui_linux/screen-capture"]
runtime_shaders = ["gpui_macos/runtime_shaders"]
wayland = ["gpui_linux/wayland"]
x11 = ["gpui_linux/x11"]
# The manual native-view examples (`examples/webview_*.rs`, `examples/wayland_surface.rs`), which
# need their platform's web engine; not built by default or in CI.
webview-examples = ["font-kit", "dep:gdkx11", "dep:gtk", "dep:webkit2gtk"]

[[bench]]
name = "fast_mode"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "inspector_render"
harness = false
required-features = ["bench-support"]

[[bench]]
name = "randomized_element_tree"
harness = false
required-features = ["bench-support"]

[dependencies]
anyhow.workspace = true
gpux.workspace = true
gpux_fonts = { workspace = true, optional = true }

[dev-dependencies]
anyhow.workspace = true
bench_metrics.workspace = true
criterion.workspace = true
raw-window-handle.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
objc2-foundation.workspace = true
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "objc2-core-foundation", "WKWebView", "WKWebViewConfiguration", "WKNavigation"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
webview2-com = "0.39.1"
windows = { workspace = true, features = ["Win32_Graphics_DirectComposition"] }
windows-core.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dev-dependencies]
gpui_wgpu.workspace = true
pollster.workspace = true
x11rb = "0.13.1"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
gpui_windows.workspace = true
gpux = { workspace = true, features = ["windows-manifest"] }

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
gpui_mobile.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_linux.workspace = true
# The WebKitGTK example only (`webview-examples`): they need the system's GTK and WebKitGTK, so
# they cannot be dev-dependencies, which every test and bench target would build.
gdkx11 = { version = "0.18", optional = true }
gtk = { version = "0.18", optional = true }
webkit2gtk = { version = "2.0.2", optional = true }

# The bundled-font test text system (`test-support`) uses the wgpu crate's Cosmic Text system on
# every desktop OS, so layout under the test platform is identical everywhere.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "windows", target_os = "macos"))'.dependencies]
gpui_wgpu = { workspace = true, optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
gpui_web.workspace = true
console_error_panic_hook.workspace = true

[[example]]
name = "webview_macos"
required-features = ["webview-examples"]

[[example]]
name = "webview_windows"
required-features = ["webview-examples"]

[[example]]
name = "webview_gtk"
required-features = ["webview-examples"]

[[example]]
name = "wayland_surface"
required-features = ["webview-examples"]
